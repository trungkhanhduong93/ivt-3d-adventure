<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245a42"/>
      <stop offset="100%" stop-color="#123726"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0966b"/>
      <stop offset="100%" stop-color="#d66838"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9eedb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#488c6b" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Warehouse Building Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Roof Overhang -->
    <path d="M7 26L32 11L57 26H7Z" fill="url(#roof)"/>
    <path d="M32 11L57 26H52L32 14L12 26H7L32 11Z" fill="#ffb48f" opacity="0.3"/>
    
    <!-- Main Warehouse Body -->
    <rect x="12" y="26" width="40" height="25" rx="2" fill="url(#wall)"/>
    
    <!-- Industrial Roll-up Shutter Door -->
    <rect x="23" y="32" width="18" height="19" rx="1.5" fill="#203d2e"/>
    <line x1="23" y1="36" x2="41" y2="36" stroke="#447358" stroke-width="1.2"/>
    <line x1="23" y1="40" x2="41" y2="40" stroke="#447358" stroke-width="1.2"/>
    <line x1="23" y1="44" x2="41" y2="44" stroke="#447358" stroke-width="1.2"/>
    <line x1="23" y1="48" x2="41" y2="48" stroke="#447358" stroke-width="1.2"/>

    <!-- Small Warehouse Vent / Circular Window on Gable -->
    <circle cx="32" cy="21" r="3.2" fill="#245a42"/>
    <circle cx="32" cy="21" r="1.5" fill="#f4c755"/>

    <!-- Golden Parcel / Supply Box In Front -->
    <polygon points="41,45 48,42 54,45 47,48" fill="#fbd872"/>
    <polygon points="41,45 47,48 47,53 41,50" fill="#d99b26"/>
    <polygon points="54,45 47,48 47,53 54,50" fill="#f2b83a"/>
  </g>
</svg>
