<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d7a58"/>
      <stop offset="100%" stop-color="#144a33"/>
    </linearGradient>
    <linearGradient id="awning" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#52b788" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Cute F&B Warehouse / Storefront -->
  <g filter="url(#glow)">
    <!-- Main Wall -->
    <rect x="13" y="24" width="38" height="26" rx="3" fill="#fdfbf7"/>
    
    <!-- Pitched Roof -->
    <polygon points="10,24 32,11 54,24" fill="#e76f51"/>
    <polygon points="12,24 32,13 52,24" fill="#f4a261"/>

    <!-- Cute Awning / Mái Hiên F&B -->
    <path d="M12 24h40v4c0 2-2 3-4 3s-4-1-4-3c0 2-2 3-4 3s-4-1-4-3c0 2-2 3-4 3s-4-1-4-3c0 2-2 3-4 3s-4-1-4-3c0 2-2 3-4 3s-4-1-4-3v-4z" fill="url(#awning)"/>
    <path d="M16 24h8v7c-2 0-3.5-1.5-4-3-.5 1.5-2 3-4 3V24z" fill="#d97706" opacity="0.3"/>
    <path d="M32 24h8v7c-2 0-3.5-1.5-4-3-.5 1.5-2 3-4 3V24z" fill="#d97706" opacity="0.3"/>
    <path d="M48 24h4v7c-2 0-3.5-1.5-4-3V24z" fill="#d97706" opacity="0.3"/>

    <!-- Large Warehouse Double Door -->
    <rect x="23" y="33" width="18" height="17" rx="2" fill="#2d6a4f"/>
    <line x1="32" y1="33" x2="32" y2="50" stroke="#fdfbf7" stroke-width="1.2"/>
    <!-- Door Windows -->
    <rect x="25.5" y="36" width="4.5" height="5" rx="1" fill="#95d5b2"/>
    <rect x="34" y="36" width="4.5" height="5" rx="1" fill="#95d5b2"/>

    <!-- Small Golden Parcel on Ground -->
    <rect x="42.5" y="43" width="6.5" height="6.5" rx="1" fill="#f59e0b"/>
    <line x1="42.5" y1="46.2" x2="49" y2="46.2" stroke="#fdfbf7" stroke-width="0.9"/>
    <line x1="45.7" y1="43" x2="45.7" y2="49.5" stroke="#fdfbf7" stroke-width="0.9"/>

    <!-- Tiny Sprout / Leaf on Roof for F&B Freshness -->
    <path d="M32 11c0-3 3-5 5-5 0 2-2 5-5 5z" fill="#74c69d"/>
    <path d="M32 11c0-2-2-4-4-4 0 2 2 4 4 4z" fill="#52b788"/>
  </g>
</svg>
